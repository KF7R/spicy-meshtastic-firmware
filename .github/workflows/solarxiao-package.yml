name: Package SolarXiao firmware
on:
  push:
    branches: [solarxiao-advanced-2.8.1]
    paths: [.github/workflows/solarxiao-package.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download successful build
        uses: actions/download-artifact@v4
        with:
          name: SolarXiao-Advanced-E22P-GPS-I2C-2.8.1
          run-id: 37192846348
          github-token: ${{ github.token }}
          path: compiled
      - name: Package verified firmware
        shell: bash
        run: |
          mkdir -p download/board-sources
          cp compiled/.pio/build/solarxiao_advanced_1w/*.uf2 download/
          cp compiled/variants/nrf52840/diy/solarxiao_advanced_1w/* download/board-sources/
          cp compiled/build.log compiled/uf2-validation.txt download/
          cp SOLARXIAO.md download/README.md
          echo "b28ec37a4092bea6e3d2554835eda395758c3312afe8ccbce8a45458835596d6  download/firmware-solarxiao_advanced_1w-2.8.1.8e6a88d.uf2" | sha256sum --check
      - name: Upload ready-to-flash package
        uses: actions/upload-artifact@v4
        with:
          name: SolarXiao-2.8.1-ready-to-flash
          path: download/
          if-no-files-found: error
