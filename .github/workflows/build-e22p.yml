name: Build E22P I2C firmware
on:
  workflow_dispatch:
    inputs:
      firmware_ref:
        description: Official meshtastic/firmware tag or full commit SHA
        required: true
        default: v2.8.1.8e6a88d
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: meshtastic/firmware
          ref: ${{ inputs.firmware_ref }}
          path: firmware
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install platformio==6.1.18
      - name: Apply isolated E22P variant
        run: python tools/prepare_e22p.py firmware
      - name: Build firmware
        shell: bash
        run: |
          set -o pipefail
          pio run -d firmware -e spicy_e22p_i2c 2>&1 | tee build.log
      - name: Collect verified UF2, OTA ZIP and build provenance
        run: python tools/collect_e22p.py firmware
      - uses: actions/upload-artifact@v4
        with:
          name: spicy-e22p-i2c-${{ github.run_number }}
          path: output/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: e22p-android-ota-${{ github.run_number }}
          path: output/*-ota.zip
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
